    function generatedImageFor(item,group){const key=imageKey(item.name);if(key==='egg foo yung'||key==='scrambled eggs')return generatedImages.egg;if(key.includes('dumplings'))return generatedImages.dumplings;if(key.includes('mineral water')||key.includes('aquafina water'))return generatedImages.water;if(key.includes('jasmine tea'))return generatedImages.tea;if(key==='mini roll'||key==='fish cracker')return generatedImages.appetizer;if(group==='SOUP')return generatedImages.soup;if(key.startsWith('stir fry broccoli')||group==='CHOP SUEY')return generatedImages.vegetable;if(['FISH','PRAWN','SQUID/DUCK/CRAB'].includes(group))return generatedImages.seafood;if(group==='HOT COFFEE')return generatedImages.hotCoffee;if(group==='COLD COFFEE')return generatedImages.coldCoffee;if(['BEVERAGES','SEASONAL FRESH JUICE','CHILLERS','ICE TEA'].includes(group))return generatedImages.refreshments;if(group==='APPETIZER')return generatedImages.appetizer;return generatedImages.special}
    function imageFor(item,group){const dealLocal=dealLocalPhotoOverrides[item.code];if(dealLocal)return dealLocal;const directKey=imageKey(item.name),local=localPhotoOverrides[directKey];if(local)return local;const dealName=dealPhotoOverrides[item.code],overrideName=dealName||photoOverrides[directKey],override=overrideName&&foodImages.get(imageKey(overrideName));if(override)return override;const alias=imageAliases[directKey],aliasKey=alias&&imageKey(alias);const direct=!blockedImageKeys.has(directKey)&&foodImages.get(directKey);const matched=!blockedImageKeys.has(directKey)&&aliasKey&&!blockedImageKeys.has(aliasKey)&&foodImages.get(aliasKey);return direct||matched||generatedImageFor(item,group)}

    function setLanguage(next,push=true){lang=next==='zh'?'zh':'en';const t=ui[lang];document.documentElement.lang=lang==='zh'?'zh-Hans':'en';document.title=lang==='zh'?'金门中餐厅 — 电子菜单':'Kim Mun Chinese Restaurant — Digital Menu';$('#heroType').textContent=t.restaurant;$('#search').placeholder=t.search;$('#search').setAttribute('aria-label',t.searchLabel);$('#cats').setAttribute('aria-label',lang==='zh'?'菜单分类':'Menu categories');$('#emptyTitle').textContent=t.noDishes;$('#emptyText').textContent=t.tryAgain;$('#locationLabel').textContent=t.locations;$('#branchTitle').textContent=t.choose;$('.close').setAttribute('aria-label',t.close);$('#footerName').textContent=t.footerName;$('#footerNote').textContent=t.footerNote;$('#footerContact').textContent=t.contact;document.querySelectorAll('.lang-btn').forEach(x=>{const active=x.dataset.lang===lang;x.classList.toggle('active',active);x.setAttribute('aria-pressed',active)});$('#topBranch').setAttribute('aria-label',lang==='zh'?'切换分店':'Change branch');$('#topBranch').textContent=(lang==='zh'?branch.zhShort:branch.short)+' ▾';if(push){const u=new URL(location);if(lang==='zh')u.searchParams.set('lang','zh');else u.searchParams.delete('lang');history.replaceState({},'',u)}renderOptions();renderSwitch();renderCats();renderMenu()}

    const params=new URLSearchParams(location.search),requested=params.get('branch'),requestedMenu=params.get('menu'),requestedLang=params.get('lang'),requestedBranch=branches.find(b=>b.id===requested)||branches[0];if(requestedMenu==='deals'&&requestedBranch.id!=='f7')menuType='deals';branch=requestedBranch;setLanguage(requestedLang==='zh'?'zh':'en',false);
